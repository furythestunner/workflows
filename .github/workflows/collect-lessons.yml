# Collects the lessons the repos marked as shared ("## Shared" in their notes/lessons.md) into
# .claude/rules/shared-lessons.md and opens or updates one "Shared lessons from the repos" pull request to main.
# Daily, and by hand from the Actions tab. Reads the repos with SYNC_TOKEN (the sync's token).
name: collect-lessons
on:
  schedule:
    - cron: '17 5 * * *'   # every day, 06:17 / 07:17 Budapest
  workflow_dispatch:
concurrency: collect-lessons
permissions:
  contents: write
  pull-requests: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/collect-lessons.sh
        env:
          REPOS_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GH_TOKEN: ${{ github.token }}

# Runs scripts/check.sh (script syntax, settings.json, the issue guard's tests, the cheat sheet) on every pull
# request and on pushes to main and dev-test.
name: check
on:
  pull_request:
  push:
    branches: [main, dev-test]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/check.sh

# What ground-truth.sh looks at. Sourced by bash: plain assignments only.

# One entry per repo: "name|path|remote|default branch|GitHub owner/repo"
#   path    relative to the project root ("." = the root itself) or absolute
#   remote  the remote that counts as "pushed" (in a fork, YOUR remote, not upstream)
#   default leave empty to read it from <remote>/HEAD
#   GitHub  leave empty to derive it from the remote URL; open PRs + CI are listed from it
# The cloud-session remote is a local proxy URL, so the GitHub repo is named here explicitly.
REPOS=("myproject|.|origin|main|owner/repo")

# Branches that stay local on purpose (private work, never pushed). Space-separated.
# The script still lists them, marked "local only BY RULE", so nobody "rescues" them with a push.
KEEP_LOCAL=""

# 1 = list the transient systemd user units (systemd-run --user) of this project; 0 = skip.
UNITS=0

# Session hooks (.claude/hooks). Plain assignments, read by bash and node.
# WORK_BRANCH  cloud sessions switch to it at start; the handoff check watches it
# HANDOFF      the handoff file, loaded at start and kept fresh after each reply
# DOCS         paths that are docs, not work: commits touching only these do not make the handoff stale
# USER_NAME    who the hook messages name as the person deciding
WORK_BRANCH="dev-test"
HANDOFF="notes/handoff.md"
DOCS="notes BACKLOG.md questions.md CLAUDE.md README.md"
USER_NAME="the user"
